name: Update industrial imagery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix industrial image URLs
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("styles.css")
          css = path.read_text(encoding="utf-8")

          replacements = {
              ".p2": "https://images.unsplash.com/photo-1738162837389-3b02d6dd507b?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=80&w=1400",
              ".p3": "https://images.unsplash.com/photo-1748347084012-075796185d56?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=80&w=1400",
              ".p4": "https://images.unsplash.com/photo-1774929108070-b60d3879e071?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=80&w=1400",
          }

          for selector, url in replacements.items():
              pattern = rf"{re.escape(selector)}\s*\{{\s*background-image:\s*url\([^)]*\)\s*\}}"
              replacement = f"{selector} {{\n    background-image:url('{url}')\n}}"
              css, count = re.subn(pattern, replacement, css, count=1, flags=re.S)
              print(selector, "fixed:", count)

          path.write_text(css, encoding="utf-8")

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          if git diff --cached --quiet; then
            echo "No image changes needed."
          else
            git commit -m "Fix Our Model industrial imagery"
            git push
          fi
